<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How Gunnison Valley Small Businesses Can Use AI Effectively and Responsibly</title>
  <desc id="desc">A Crest Code blog hero using a real summer photograph of Elk Avenue in Crested Butte, Colorado, with the official Crest Code logo.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10171f" stop-opacity="0.86"/>
      <stop offset="0.48" stop-color="#10171f" stop-opacity="0.58"/>
      <stop offset="0.74" stop-color="#10171f" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#10171f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.34"/>
    </linearGradient>
  </defs>

  <image href="https://gunnisoncrestedbutte.com/wp-content/uploads/elk-avenue-crested-butte-colorado-2.jpg" x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#shade)"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#bottom)"/>

  <g transform="translate(90 92)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2.4" fill="#f0c36b">CREST CODE • CRESTED BUTTE</text>

    <text x="0" y="98" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff">
      <tspan x="0" dy="0">How Small Businesses</tspan>
      <tspan x="0" dy="88">Can Use AI</tspan>
      <tspan x="0" dy="88">Effectively and</tspan>
      <tspan x="0" dy="88">Responsibly</tspan>
    </text>

    <rect x="0" y="420" width="112" height="6" rx="3" fill="#f0c36b"/>

    <text x="0" y="490" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500" fill="#f8fafc">
      <tspan x="0" dy="0">Practical ways to save time, improve operations,</tspan>
      <tspan x="0" dy="44">and use AI without losing the human judgment</tspan>
      <tspan x="0" dy="44">that makes a local business worth trusting.</tspan>
    </text>
  </g>

  <g transform="translate(90 700)">
    <rect x="0" y="0" width="620" height="118" rx="20" fill="#0d131a" fill-opacity="0.9"/>
    <rect x="22" y="22" width="140" height="74" rx="14" fill="#ffffff" fill-opacity="0.08"/>
    <image href="/crest-code-creative.svg" x="31" y="29" width="122" height="60" preserveAspectRatio="xMidYMid meet"/>
    <text x="190" y="48" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="760" letter-spacing="1" fill="#ffffff">CREST CODE</text>
    <text x="190" y="82" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#f0c36b">Technology that works as hard as you do.</text>
  </g>

  <g transform="translate(1270 756)">
    <rect x="0" y="0" width="238" height="66" rx="16" fill="#0d131a" fill-opacity="0.82"/>
    <text x="22" y="28" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">ELK AVENUE</text>
    <text x="22" y="50" font-family="Inter, Arial, sans-serif" font-size="15" fill="#f0c36b">Crested Butte, Colorado</text>
  </g>
</svg>