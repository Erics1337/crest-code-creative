<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI for small business in the Gunnison Valley</title>
  <desc id="desc">A Crest Code blog hero using a real photograph of Main Street in Gunnison, Colorado, with the official Crest Code logo.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7f4ee" stop-opacity="1"/>
      <stop offset="0.46" stop-color="#f7f4ee" stop-opacity="0.98"/>
      <stop offset="0.64" stop-color="#f7f4ee" stop-opacity="0.78"/>
      <stop offset="0.82" stop-color="#f7f4ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f7f4ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="photoShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d5b16c" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <clipPath id="photoClip">
      <rect x="0" y="0" width="1600" height="900" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#photoClip)">
    <image href="https://upload.wikimedia.org/wikipedia/commons/2/25/Main_Street_of_Gunnison%2C_CO.jpg" x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="0" width="1600" height="900" fill="url(#photoShade)"/>
  </g>

  <rect x="0" y="0" width="1120" height="900" fill="url(#fade)"/>
  <rect x="0" y="0" width="900" height="900" fill="url(#grid)" opacity="0.35"/>

  <g transform="translate(92 88)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2.6" fill="#8b6a2f">CREST CODE • GUNNISON VALLEY</text>

    <text x="0" y="92" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800" fill="#111820">
      <tspan x="0" dy="0">How Small Businesses</tspan>
      <tspan x="0" dy="88">Can Use AI</tspan>
      <tspan x="0" dy="88">Effectively and</tspan>
      <tspan x="0" dy="88">Responsibly</tspan>
    </text>

    <rect x="0" y="418" width="118" height="6" rx="3" fill="#c89a45"/>

    <text x="0" y="486" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="500" fill="#303842">
      <tspan x="0" dy="0">Practical ways to save time, improve operations,</tspan>
      <tspan x="0" dy="46">and support your team without losing the human</tspan>
      <tspan x="0" dy="46">judgment that makes local business work.</tspan>
    </text>

    <g transform="translate(0 650)">
      <rect x="0" y="0" width="690" height="118" rx="22" fill="#10171f" fill-opacity="0.93"/>
      <rect x="24" y="24" width="132" height="70" rx="14" fill="#ffffff" fill-opacity="0.06"/>
      <image href="/crest-code-creative.svg" x="32" y="30" width="116" height="58" preserveAspectRatio="xMidYMid meet"/>
      <text x="186" y="47" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="760" letter-spacing="1" fill="#fff">CREST CODE</text>
      <text x="186" y="82" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#d8c49a">Technology that works as hard as you do.</text>
    </g>
  </g>

  <g transform="translate(1240 720)">
    <rect x="0" y="0" width="274" height="92" rx="18" fill="#10171f" fill-opacity="0.9"/>
    <text x="26" y="39" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">REAL GUNNISON, COLORADO</text>
    <text x="26" y="67" font-family="Inter, Arial, sans-serif" font-size="16" fill="#d8c49a">Main Street • 2019</text>
  </g>
</svg>